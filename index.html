<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高速公路危害点照片采集系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}
.header{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:24px 16px 20px;text-align:center}
.header h1{font-size:20px;font-weight:600;margin-bottom:6px}
.header p{font-size:13px;opacity:.85}
.container{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:15px;font-weight:600;color:#1a73e8;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card p{font-size:13px;color:#666;line-height:1.6;margin-bottom:12px}
.link-list{list-style:none}
.link-list li{margin-bottom:8px}
.link-list a{display:block;padding:14px 16px;background:#f8f9fa;border:1.5px solid #e0e0e0;border-radius:10px;text-decoration:none;color:#1a1a1a;font-size:14px;font-weight:500;transition:all .2s}
.link-list a:active{background:#e3f2fd;border-color:#90caf9;transform:scale(.98)}
.link-list a .desc{display:block;font-size:12px;color:#888;font-weight:400;margin-top:4px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;margin-left:6px;font-weight:500;vertical-align:middle}
.tag-blue{background:#e3f2fd;color:#1565c0}
.tag-green{background:#e8f5e9;color:#2e7d32}
.tag-orange{background:#fff3e0;color:#e65100}
.footer{text-align:center;padding:16px;font-size:12px;color:#999}
</style>
</head>
<body>
<div class="header">
<h1>高速公路危害点照片采集</h1>
<p>请选择适合你的表单版本</p>
</div>
<div class="container">
<div class="card">
<h2>📱 浏览器版本</h2>
<p>适用于手机浏览器直接打开使用，支持拍照和相册上传。</p>
<ul class="link-list">
<li><a href="form.html">标准版<span class="desc">基础表单，无照片大小调整</span></a></li>
<li><a href="form-browser-photo.html">照片调整版<span class="desc">可自定义照片压缩大小（默认500KB）</span><span class="tag tag-blue">推荐</span></a></li>
</ul>
</div>
<div class="card">
<h2>📋 WPS 版本</h2>
<p>适用于 WPS 多维表格用户，数据直接写入飞书多维表格。</p>
<ul class="link-list">
<li><a href="form-wps-clean.html">标准版<span class="desc">基础表单，无照片大小调整</span></a></li>
<li><a href="form-wps-photo.html">照片调整版<span class="desc">可自定义照片压缩大小（默认2MB）</span><span class="tag tag-green">推荐</span></a></li>
</ul>
</div>
<div class="card">
<h2> 使用说明</h2>
<ul class="link-list">
<li><a href="工人使用说明.html">工人使用说明<span class="desc">详细的操作指南</span></a></li>
</ul>
</div>
</div>
<div class="footer">高速公路危害点照片采集系统 v1.0</div>
</body>
</html>
