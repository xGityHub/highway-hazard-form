<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公路隐患照片采集系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 28px 20px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: #333;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9ff;
            border: 1px solid #e8ecff;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease;
            min-height: 64px;
            -webkit-tap-highlight-color: rgba(102,126,234,0.15);
        }
        .card:active {
            background: #edf0ff;
            border-color: #c0caff;
            transform: scale(0.98);
        }
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            margin-right: 12px;
        }
        .card-body {
            flex: 1;
            min-width: 0;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }
        .card-desc {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        .card-arrow {
            font-size: 18px;
            color: #ccc;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .icon-browser { background: #dbeafe; color: #3b82f6; }
        .icon-wps { background: #dcfce7; color: #22c55e; }
        .icon-doc { background: #fef3c7; color: #f59e0b; }

        .section-title {
            font-size: 12px;
            color: #aaa;
            margin: 20px 0 8px 4px;
            font-weight: 500;
        }

        .tip-box {
            margin-top: 20px;
            padding: 12px 14px;
            background: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 10px;
            font-size: 13px;
            color: #f57f17;
            text-align: center;
            line-height: 1.6;
        }
        .tip-box strong {
            color: #e65100;
        }

        /* 大屏电脑优化 */
        @media (min-width: 600px) {
            body {
                align-items: center;
                padding: 20px;
            }
            .container {
                padding: 40px 36px;
                margin-top: 0;
            }
            h1 { font-size: 26px; }
            .subtitle { font-size: 14px; margin-bottom: 32px; }
            .card {
                padding: 16px 20px;
                margin-bottom: 14px;
            }
            .card:hover {
                background: #edf0ff;
                border-color: #c0caff;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(102,126,234,0.15);
            }
            .card-icon {
                width: 44px;
                height: 44px;
                margin-right: 14px;
            }
            .card-title { font-size: 16px; }
            .card-desc { font-size: 13px; }
            .section-title { font-size: 13px; margin: 24px 0 10px 4px; }
            .tip-box { padding: 14px 16px; font-size: 14px; margin-top: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>公路隐患照片采集</h1>
        <p class="subtitle">选择你需要使用的表单工具</p>

        <a class="card" href="form.html">
            <div class="card-icon icon-browser">🌐</div>
            <div class="card-body">
                <div class="card-title">浏览器表单</div>
                <div class="card-desc">使用浏览器填写的表单页面</div>
            </div>
            <div class="card-arrow">→</div>
        </a>

        <a class="card" href="form-wps.html">
            <div class="card-icon icon-wps">📋</div>
            <div class="card-body">
                <div class="card-title">WPS 表单</div>
                <div class="card-desc">使用 WPS 填写的表单页面</div>
            </div>
            <div class="card-arrow">→</div>
        </a>

        <p class="section-title">📄 说明文档</p>

        <a class="card" href="工人使用说明.html">
            <div class="card-icon icon-doc">📖</div>
            <div class="card-body">
                <div class="card-title">工人使用说明</div>
                <div class="card-desc">浏览器表单工作使用说明</div>
            </div>
            <div class="card-arrow">→</div>
        </a>

        <a class="card" href="wps-manual.html">
            <div class="card-icon icon-doc">📗</div>
            <div class="card-body">
                <div class="card-title">WPS 表单制作说明</div>
                <div class="card-desc">WPS 表单的创建与使用方法</div>
            </div>
            <div class="card-arrow">→</div>
        </a>

        <div class="tip-box">
            💡 <strong>提示：</strong>脚本请用 AI 或者关注"阳光行者路"公众号索要。
        </div>
    </div>
</body>
</html>
